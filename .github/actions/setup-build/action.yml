name: Set up build toolchain
description: Shared JDK + Gradle (with caching) + pnpm/Node setup for Gradle workflows.

inputs:
  gradle:
    description: Whether to set up Gradle with GitHub Actions caching.
    type: boolean
    default: true
  web:
    description: Whether to set up pnpm/Node and install web-ui dependencies.
    type: boolean
    default: true
  cache-encryption-key:
    description: Base64 AES key; enables cross-runner configuration-cache reuse.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        distribution: temurin
        # Gradle runtime only; compilation still targets Java 17 via
        # compileOptions/jvmTarget in the build scripts.
        java-version: '21'

    - name: Set up Gradle
      # Caches Gradle User Home: distribution, resolved dependencies, toolchain
      # JDKs, and build-cache entries (org.gradle.caching=true). The
      # encryption key additionally persists configuration-cache entries,
      # which embed absolute paths and potential credentials.
      if: inputs.gradle == 'true'
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}

    - name: Set up pnpm
      # Shell guard instead of pnpm/action-setup: the action installs into
      # ~/setup-pnpm, so verify pnpm 11 explicitly and fall back to a runner-temp install
      # when the image does not already provide the required version.
      if: inputs.web == 'true'
      shell: bash
      run: |
        set -euo pipefail
        pnpm_version="$(pnpm --version 2>/dev/null || true)"
        if ! printf '%s\n' "$pnpm_version" | grep -Eq '^11([.]|$)'; then
          pnpm_root="$RUNNER_TEMP/pnpm-11"
          npm install --global --prefix "$pnpm_root" pnpm@11
          echo "$pnpm_root/bin" >> "$GITHUB_PATH"
          export PATH="$pnpm_root/bin:$PATH"
        fi
        pnpm --version | grep -Eq '^11([.]|$)'

    - name: Set up Node 22
      if: inputs.web == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web-ui/pnpm-lock.yaml

    - name: Install web-ui dependencies
      if: inputs.web == 'true'
      shell: bash
      working-directory: web-ui
      run: pnpm install --frozen-lockfile
