name: Set up private Android toolchain
description: Install the reproducible Android/JDK/Node toolchain required by StudioAi self-hosted runners.

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Node 22
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Set up pnpm 11 and Android SDK
      shell: bash
      run: |
        set -euo pipefail

        runner_slug="$(printf '%s' "$RUNNER_NAME" | tr -cs 'A-Za-z0-9_.-' '-')"
        tool_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}"
        sdk_root="$tool_root/android-sdk-$runner_slug"
        gradle_home="$tool_root/gradle-studioai-$runner_slug"
        pnpm_root="$tool_root/pnpm-11-$runner_slug"

        mkdir -p "$sdk_root" "$gradle_home" "$pnpm_root"

        pnpm_version=''
        if command -v pnpm >/dev/null 2>&1; then
          pnpm_version="$(pnpm --version 2>/dev/null || true)"
        fi
        if ! printf '%s\n' "$pnpm_version" | grep -Eq '^11([.]|$)'; then
          npm install --global --prefix "$pnpm_root" pnpm@11
          echo "$pnpm_root/bin" >> "$GITHUB_PATH"
          export PATH="$pnpm_root/bin:$PATH"
        fi
        pnpm --version | grep -Eq '^11([.]|$)'

        cmdline_version='15859902'
        cmdline_sha256='4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583'
        android_cli="$sdk_root/cmdline-tools/latest/bin/android"

        if [ ! -x "$android_cli" ]; then
          archive="$RUNNER_TEMP/commandlinetools-linux-${cmdline_version}_latest.zip"
          unpack_dir="$RUNNER_TEMP/android-commandlinetools-$runner_slug"
          rm -rf "$unpack_dir" "$sdk_root/cmdline-tools/latest"
          mkdir -p "$unpack_dir" "$sdk_root/cmdline-tools/latest"
          curl --fail --location --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-${cmdline_version}_latest.zip" \
            --output "$archive"
          printf '%s  %s\n' "$cmdline_sha256" "$archive" | sha256sum --check --strict
          python3 -m zipfile -e "$archive" "$unpack_dir"
          cp -a "$unpack_dir/cmdline-tools/." "$sdk_root/cmdline-tools/latest/"
          chmod 0755 "$sdk_root/cmdline-tools/latest/bin/"*
          rm -rf "$unpack_dir" "$archive"
        fi

        test -x "$android_cli"
        export ANDROID_HOME="$sdk_root"
        export ANDROID_SDK_ROOT="$sdk_root"

        # Android 17 remains the Cinnamon Bun Preview platform. Google's package
        # metadata exposes it by codename (`android-CinnamonBun`) even though
        # Gradle's compileSdk is the numeric API level 37.
        set +o pipefail
        yes | "$android_cli" --sdk="$sdk_root" sdk install --canary \
          platform-tools \
          platforms/android-36 \
          platforms/android-CinnamonBun \
          build-tools/36.0.0 \
          ndk/28.2.13676358 \
          cmake/3.22.1
        install_rc=$?
        set -o pipefail
        test "$install_rc" -eq 0

        echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$sdk_root/ndk/28.2.13676358" >> "$GITHUB_ENV"
        echo "GRADLE_USER_HOME=$gradle_home" >> "$GITHUB_ENV"
        echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
        echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$sdk_root/cmake/3.22.1/bin" >> "$GITHUB_PATH"

        java -version
        node --version | grep -Eq '^v22([.]|$)'
        pnpm --version | grep -Eq '^11([.]|$)'
        test -d "$sdk_root/platforms/android-CinnamonBun"
        test -d "$sdk_root/build-tools/36.0.0"
        test -d "$sdk_root/ndk/28.2.13676358"
        test -d "$sdk_root/cmake/3.22.1"
