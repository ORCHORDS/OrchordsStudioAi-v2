name: Branch Verification

# Speculative same-repository branch feedback. This is intentionally not a
# protected required gate; pull-request validation owns full Android lint and
# all required contexts. Private-repo execution uses the same dedicated runner.
on:
  push:
    branches-ignore:
      - main
      - 'gh-readonly-queue/**'
      - 'nightly'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: warmup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
runs-on: Node_Runner
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          gradle: false

      - name: Verify branch tests, providers and debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -PciVerify :app:testDebugUnitTest :ai:test :app:assembleDebug
