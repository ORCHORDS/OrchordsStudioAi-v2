name: CodeQL

# Full static analysis is intentionally off the ordinary direct-to-main push
# path. Pull requests/merge queues still get exact-change analysis, build-
# pipeline changes revalidate immediately, and the weekly sweep covers main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-build/**'
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: main-verification
    timeout-minutes: 45
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build: true
          - language: javascript-typescript
            build: false
          - language: actions
            build: false
          - language: c-cpp
            build: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Verify material-color-utilities source identity
        if: matrix.build
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          expected="$(git ls-tree HEAD material3/material-color-utilities | awk '{print $3}')"
          actual="$(git -C material3/material-color-utilities rev-parse HEAD)"
          test -n "$expected"
          test "$actual" = "$expected"
          test -f material3/material-color-utilities/kotlin/dynamiccolor/DynamicScheme.kt

      - name: Set up build toolchain
        if: matrix.build
        uses: ./.github/actions/setup-build
        with:
          web: false
          gradle: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build && 'manual' || 'none' }}

      - name: Compile for extraction
        if: matrix.build
        run: ./gradlew -PcodeqlForceCompile=true :material3:compileDebugUnitTestKotlin :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
