name: Daily Build

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check for recent commits
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          response="$(curl --fail-with-body --silent --show-error \
            --get \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "since=$since" \
            --data-urlencode "per_page=1" \
            "https://api.github.com/repos/$REPOSITORY/commits")"
          count="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(len(data) if isinstance(data, list) else 0)')"
          if [ "$count" -gt 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the past 24 hours, skipping build"
          fi

      - name: Checkout repository
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Android and web build toolchain
        if: steps.check.outputs.should_build == 'true'
        uses: ./.github/actions/setup-build

      - name: Select build mode
        if: steps.check.outputs.should_build == 'true'
        id: build_mode
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are unavailable; producing an unsigned debug nightly artifact instead."
          fi

      - name: Prepare signing files
        if: steps.check.outputs.should_build == 'true' && steps.build_mode.outputs.signed == 'true'
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s' "$SIGNING_CONFIG" > local.properties

      - name: Gradle Build
        if: steps.check.outputs.should_build == 'true'
        env:
          GRADLE_TASK: ${{ steps.build_mode.outputs.gradle_task }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew "$GRADLE_TASK"

      - name: Remove signing files
        if: always() && steps.check.outputs.should_build == 'true'
        shell: bash
        run: rm -f app/app.key local.properties

      - name: Generate APK checksums
        if: steps.check.outputs.should_build == 'true'
        env:
          APK_DIR: ${{ steps.build_mode.outputs.apk_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$APK_DIR"
          sha256sum -- *.apk > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Stage APK artifact
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-apks
          path: |
            ${{ steps.build_mode.outputs.apk_dir }}/*.apk
            ${{ steps.build_mode.outputs.apk_dir }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Attest APK build provenance
        if: steps.check.outputs.should_build == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'app/build/outputs/apk/*/*.apk'

      - name: Generate complete release notes
        if: steps.check.outputs.should_build == 'true'
        env:
          APK_DIR: ${{ steps.build_mode.outputs.apk_dir }}
          SIGNED_BUILD: ${{ steps.build_mode.outputs.signed }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          if [ "$SIGNED_BUILD" = "true" ]; then
            build_type="signed release APK"
          else
            build_type="unsigned debug APK"
          fi

          {
            echo '# ORCHORDS Studio AI — Latest Nightly'
            echo
            echo 'This is the newest installable Android build from the current `main` branch and includes all work listed below.'
            echo
            echo '## Build'
            echo
            echo "- Commit: \`$BUILD_SHA\`"
            echo "- Built: $built_at"
            echo "- Package type: $build_type"
            echo '- Channel: rolling `nightly` prerelease'
            echo
            echo '## APK downloads'
            echo
            echo '- **Universal APK** — recommended when you are unsure which ABI your device uses.'
            echo '- **ARM64 APK** — recommended for most modern Android phones/tablets.'
            echo '- **x86_64 APK** — intended for compatible emulators/x86_64 devices.'
            echo '- `SHA256SUMS` — checksums for every APK attached to this release.'
            echo
            echo '## Included work'
            echo
            echo 'The following `main` commits are included in this APK, newest first. This list covers the current nightly development line from 2026-08-31 through this build:'
            echo
            git log --since='2026-08-31T00:00:00Z' --date=short --pretty=format:'- %s (`%h`, %ad)' --no-merges
            echo
            echo
            echo '## Verification and provenance'
            echo
            echo '- APK SHA-256 checksums are generated and verified during the build, then attached as `SHA256SUMS`.'
            echo '- GitHub artifact attestation is published for the APK build provenance.'
            echo '- The release is rebuilt from the exact commit shown above; the APK and release notes therefore identify the same source revision.'
            if [ "$SIGNED_BUILD" = "true" ]; then
              echo '- Repository signing material was available, so this nightly was built using the release signing path.'
            else
              echo '- Repository signing material was not available to this workflow run, so the attached APKs are debug builds rather than signed production-release APKs.'
            fi
            echo
            echo '> Development/nightly build: it contains the newest work and may be less stable than a production release.'
          } > release-notes.md

          printf '\nGenerated release notes with %s shipped commits.\n' "$(git rev-list --count --since='2026-08-31T00:00:00Z' HEAD)"
          test -s release-notes.md
          test -s "$APK_DIR/SHA256SUMS"

      - name: Remove previous rolling nightly release
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi

      - name: Publish nightly prerelease
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: ORCHORDS Studio AI — Latest Nightly
          prerelease: true
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/*/*.apk
            app/build/outputs/apk/*/SHA256SUMS
