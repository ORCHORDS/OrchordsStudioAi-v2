name: Daily Build

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Daily Build
    runs-on: Node_Runner
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Decide whether scheduled build is needed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          since="$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"
          response="$(curl --fail-with-body --silent --show-error \
            --get \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "since=$since" \
            --data-urlencode "per_page=1" \
            "https://api.github.com/repos/$REPOSITORY/commits")"
          count="$(printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(len(data) if isinstance(data, list) else 0)')"
          if [ "$count" -gt 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No main commits in the last 24 hours; scheduled build skipped."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.should_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Install private Android toolchain
        if: steps.gate.outputs.should_build == 'true'
        uses: ./.github/actions/setup-private-android-toolchain

      - name: Verify release toolchain
        if: steps.gate.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(java -version 2>&1 | head -n1)"
          printf '%s\n' "$java_version"
          printf '%s\n' "$java_version" | grep -Eq 'version "21([.]|\")'
          node --version | grep -Eq '^v22([.]|$)'
          pnpm --version | grep -Eq '^11([.]|$)'
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"

      - name: Select build mode
        if: steps.gate.outputs.should_build == 'true'
        id: build_mode
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/release" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_dir=app/build/outputs/apk/debug" >> "$GITHUB_OUTPUT"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "Signing secrets unavailable; publishing installable debug APKs."
          fi

      - name: Resolve monotonically increasing release version
        if: steps.gate.outputs.should_build == 'true'
        id: app_version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RUN_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::github.run_number is not numeric: $RUN_NUMBER"
              exit 1
              ;;
          esac

          version_name="0.1.${RUN_NUMBER}"
          version_code=$((1000000 + RUN_NUMBER))
          if [ "$version_code" -gt 2100000000 ]; then
            echo "::error::Calculated Android versionCode exceeds supported range: $version_code"
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Publishing Android version $version_name ($version_code)"

      - name: Prepare signing files
        if: steps.gate.outputs.should_build == 'true' && steps.build_mode.outputs.signed == 'true'
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s' "$SIGNING_CONFIG" > local.properties

      - name: Verify and build all APKs
        if: steps.gate.outputs.should_build == 'true'
        env:
          GRADLE_TASK: ${{ steps.build_mode.outputs.gradle_task }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Do not use -PciVerify here: app/build.gradle.kts disables ABI
          # splits under ciVerify, while Releases require the full APK matrix.
          ./gradlew --stacktrace \
            -PreleaseVersionName="$APP_VERSION_NAME" \
            -PreleaseVersionCode="$APP_VERSION_CODE" \
            :app:testDebugUnitTest \
            :ai:test \
            :workspace:test \
            :app:lintDebug \
            "$GRADLE_TASK"

      - name: Remove signing files
        if: always() && steps.gate.outputs.should_build == 'true'
        shell: bash
        run: rm -f app/app.key local.properties

      - name: Verify complete APK matrix and embedded version
        if: steps.gate.outputs.should_build == 'true'
        env:
          APK_DIR: ${{ steps.build_mode.outputs.apk_dir }}
          VARIANT: ${{ steps.build_mode.outputs.variant }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer"
          expected=(
            "$APK_DIR/app-universal-$VARIANT.apk"
            "$APK_DIR/app-arm64-v8a-$VARIANT.apk"
            "$APK_DIR/app-x86_64-$VARIANT.apk"
          )
          for apk in "${expected[@]}"; do
            test -s "$apk" || {
              echo "::error::Expected APK missing or empty: $apk"
              exit 1
            }
            actual_name="$("$apkanalyzer" manifest version-name "$apk" | tr -d '\r\n')"
            actual_code="$("$apkanalyzer" manifest version-code "$apk" | tr -d '\r\n')"
            if [ "$actual_name" != "$APP_VERSION_NAME" ]; then
              echo "::error::APK versionName mismatch for $apk: expected $APP_VERSION_NAME, got $actual_name"
              exit 1
            fi
            if [ "$actual_code" != "$APP_VERSION_CODE" ]; then
              echo "::error::APK versionCode mismatch for $apk: expected $APP_VERSION_CODE, got $actual_code"
              exit 1
            fi
          done
          actual_count="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          test "$actual_count" -eq 3 || {
            echo "::error::Expected exactly 3 APK outputs, found $actual_count"
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print
            exit 1
          }

          rm -rf release-assets
          mkdir -p release-assets
          cp "$APK_DIR/app-universal-$VARIANT.apk" release-assets/orchords-studio-ai-universal.apk
          cp "$APK_DIR/app-arm64-v8a-$VARIANT.apk" release-assets/orchords-studio-ai-arm64-v8a.apk
          cp "$APK_DIR/app-x86_64-$VARIANT.apk" release-assets/orchords-studio-ai-x86_64.apk

      - name: Generate and verify SHA-256 checksums
        if: steps.gate.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -- *.apk > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload exact APK artifact bundle
        if: steps.gate.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-apks
          path: |
            release-assets/*.apk
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Generate release notes
        if: steps.gate.outputs.should_build == 'true'
        env:
          SIGNED_BUILD: ${{ steps.build_mode.outputs.signed }}
          BUILD_SHA: ${{ github.sha }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          if [ "$SIGNED_BUILD" = "true" ]; then
            build_type="signed release APK"
          else
            build_type="debug APK"
          fi
          {
            echo '# ORCHORDS Studio AI — Latest Android Build'
            echo
            echo "- App version: \`$APP_VERSION_NAME\`"
            echo "- Version code: \`$APP_VERSION_CODE\`"
            echo "- Daily Build run: \`#$RUN_NUMBER\`"
            echo "- Commit: \`$BUILD_SHA\`"
            echo "- Built: $built_at"
            echo "- Package type: $build_type"
            echo
            echo '## APK downloads'
            echo '- `orchords-studio-ai-universal.apk`'
            echo '- `orchords-studio-ai-arm64-v8a.apk`'
            echo '- `orchords-studio-ai-x86_64.apk`'
            echo '- `SHA256SUMS`'
            echo
            echo '## Verification'
            echo '- Unit tests and Android lint passed in this release workflow.'
            echo '- The workflow verified exactly the configured universal, arm64-v8a and x86_64 APK outputs.'
            echo '- Every APK manifest was verified to embed the exact version name and version code shown above.'
            echo '- SHA-256 checksums were generated and verified before upload.'
            echo
            echo 'GitHub artifact attestations are intentionally not used here because this is a private user-owned repository and that GitHub feature is unavailable for this repository type.'
          } > release-notes.md
          test -s release-notes.md

      - name: Point latest tag at exact build commit
        if: steps.gate.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          get_url="https://api.github.com/repos/$REPOSITORY/git/ref/tags/latest"
          patch_url="https://api.github.com/repos/$REPOSITORY/git/refs/tags/latest"
          headers=(
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer $GH_TOKEN"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          status="$(curl --silent --show-error -o /tmp/latest-ref.json -w '%{http_code}' "${headers[@]}" "$get_url")"
          if [ "$status" = "200" ]; then
            payload="$(BUILD_SHA="$BUILD_SHA" python3 -c 'import json,os; print(json.dumps({"sha": os.environ["BUILD_SHA"], "force": True}))')"
            curl --fail-with-body --silent --show-error -X PATCH "${headers[@]}" --data "$payload" "$patch_url" >/dev/null
          elif [ "$status" = "404" ]; then
            payload="$(BUILD_SHA="$BUILD_SHA" python3 -c 'import json,os; print(json.dumps({"ref": "refs/tags/latest", "sha": os.environ["BUILD_SHA"]}))')"
            curl --fail-with-body --silent --show-error -X POST "${headers[@]}" --data "$payload" "https://api.github.com/repos/$REPOSITORY/git/refs" >/dev/null
          else
            cat /tmp/latest-ref.json
            echo "::error::Unable to inspect latest tag (HTTP $status)"
            exit 1
          fi

      - name: Remove stale APK assets from rolling latest release
        if: steps.gate.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o /tmp/latest-release-before.json -w '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/releases/tags/latest")"
          if [ "$status" = "404" ]; then
            exit 0
          fi
          if [ "$status" != "200" ]; then
            cat /tmp/latest-release-before.json
            echo "::error::Unable to inspect existing latest release (HTTP $status)"
            exit 1
          fi
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1], encoding="utf-8")); [print(a["id"]) for a in r.get("assets", []) if a.get("name", "").endswith(".apk") or a.get("name") == "SHA256SUMS"]' /tmp/latest-release-before.json > /tmp/old-asset-ids.txt
          while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            curl --fail-with-body --silent --show-error -X DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/releases/assets/$asset_id"
          done < /tmp/old-asset-ids.txt

      - name: Publish GitHub Latest APK release
        if: steps.gate.outputs.should_build == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: ORCHORDS Studio AI v${{ steps.app_version.outputs.version_name }} — Latest APK
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS

      - name: Verify live GitHub Latest release
        if: steps.gate.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          APP_VERSION_NAME: ${{ steps.app_version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.app_version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer $GH_TOKEN"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/releases/latest" > /tmp/latest-release.json
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/tags/latest" > /tmp/latest-ref.json
          BUILD_SHA="$BUILD_SHA" APP_VERSION_NAME="$APP_VERSION_NAME" APP_VERSION_CODE="$APP_VERSION_CODE" python3 - <<'PY'
          import json
          import os

          release = json.load(open('/tmp/latest-release.json', encoding='utf-8'))
          ref = json.load(open('/tmp/latest-ref.json', encoding='utf-8'))
          expected_assets = {
              'orchords-studio-ai-universal.apk',
              'orchords-studio-ai-arm64-v8a.apk',
              'orchords-studio-ai-x86_64.apk',
              'SHA256SUMS',
          }
          assets = release.get('assets', [])
          asset_names = {a.get('name') for a in assets}
          assert release.get('tag_name') == 'latest', release.get('tag_name')
          assert release.get('target_commitish') == os.environ['BUILD_SHA'], release.get('target_commitish')
          assert release.get('draft') is False, 'Latest release is draft'
          assert release.get('prerelease') is False, 'Latest release is prerelease'
          assert asset_names == expected_assets, (asset_names, expected_assets)
          for asset in assets:
              assert asset.get('state') == 'uploaded', (asset.get('name'), asset.get('state'))
              assert int(asset.get('size', 0)) > 0, (asset.get('name'), asset.get('size'))
          expected_title = f"v{os.environ['APP_VERSION_NAME']}"
          assert expected_title in release.get('name', ''), release.get('name')
          body = release.get('body', '')
          assert f"App version: `{os.environ['APP_VERSION_NAME']}`" in body, 'Release notes version mismatch'
          assert f"Version code: `{os.environ['APP_VERSION_CODE']}`" in body, 'Release notes versionCode mismatch'
          assert ref.get('object', {}).get('sha') == os.environ['BUILD_SHA'], ref
          print('Latest release verified: exact SHA, embedded build version metadata and complete 3-APK matrix')
          PY
