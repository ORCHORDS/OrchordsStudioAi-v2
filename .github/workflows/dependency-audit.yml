name: Dependency Audit

# Keep workflow_dispatch available for current-head revalidation after CI repairs.
on:
  push:
    branches: [main]
    paths:
      - 'trace-cli/package.json'
      - 'trace-cli/bun.lock'
      - 'web-ui/package.json'
      - 'web-ui/pnpm-lock.yaml'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: Node_Runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Verify pnpm and Node on private runner
        shell: bash
        run: |
          set -euo pipefail
          node -v | grep -q '^v22'
          command -v pnpm >/dev/null

      - name: Audit web-ui dependency graph
        working-directory: web-ui
        shell: bash
        run: |
          set -o pipefail
          pnpm audit --prod --lockfile-only --ignore-registry-errors --json \
            | tee pnpm-audit.json

  bun-trace-cli-audit:
    runs-on: Node_Runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Audit trace-cli Bun dependency graph
        working-directory: trace-cli
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            : > bun-audit.json
            : > bun-audit.stderr
            set +e
            bun audit --prod --json > bun-audit.json 2> bun-audit.stderr
            status=$?
            set -e
            if [ -s bun-audit.json ]; then cat bun-audit.json; fi
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ -s bun-audit.json ] && jq -e . bun-audit.json >/dev/null 2>&1; then
              cat bun-audit.stderr >&2
              echo '::error::Bun audit returned a valid vulnerability report.'
              exit "$status"
            fi
            if ! grep -Eqi '(^|[^0-9])5[0-9]{2}([^0-9]|$)|timeout|timed out|ECONNRESET|EAI_AGAIN|ENETUNREACH|registry.*(unavailable|error)' bun-audit.stderr; then
              cat bun-audit.stderr >&2
              exit "$status"
            fi
            cat bun-audit.stderr >&2
            if [ "$attempt" -lt 3 ]; then
              echo "Bun advisory registry unavailable (attempt $attempt/3); retrying."
              sleep $((attempt * 5))
            fi
          done
          echo '::warning::Bun advisory registry stayed unavailable after 3 attempts; transport failure is not treated as a vulnerability finding.'
