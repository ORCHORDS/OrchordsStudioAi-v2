name: Gradle Dependency Submission

# Keep workflow_dispatch available for current-head revalidation after CI repairs.
on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/gradle-dependency-submission.yml'
  schedule:
    - cron: '31 2 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Install pinned Android toolchain
        uses: ./.github/actions/setup-private-android-toolchain

      - name: Verify JDK 21
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1 | head -n1 | grep -Eq 'version "21([.]|\")'

      - name: Submit resolved Gradle dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
