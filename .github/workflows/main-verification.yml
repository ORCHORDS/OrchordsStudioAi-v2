name: Main Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
  cancel-in-progress: true

env:
  # Isolate StudioAi from shared ~/.gradle init/caches on the persistent host.
  # The dedicated path survives jobs and becomes a warm repo-local CI cache.
  GRADLE_USER_HOME: /home/orchords/.gradle-studioai

jobs:
  verify:
    name: Main Verification
    runs-on: ubuntu-24.04-x64
    # This is a failure guard, not a resource throttle. Keep enough headroom
    # for a cold Android graph while normal warm runs should finish far sooner.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Verify private Android toolchain and seed Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          java_bin="$(readlink -f "$(command -v java)")"
          java_version="$("$java_bin" -version 2>&1 | head -n1)"
          if ! printf '%s\n' "$java_version" | grep -Eq 'version "21([.]|\")'; then
            java_bin="$(find /home/orchords/actions-toolcache/Java_Temurin-Hotspot_jdk -type f -path '*/x64/bin/java' 2>/dev/null | sort -V | tail -1)"
            test -n "$java_bin"
            java_version="$("$java_bin" -version 2>&1 | head -n1)"
            printf '%s\n' "$java_version" | grep -Eq 'version "21([.]|\")'
          fi
          java_home="$(dirname "$(dirname "$java_bin")")"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"

          mkdir -p "$GRADLE_USER_HOME/wrapper/dists"
          if [ ! -d "$GRADLE_USER_HOME/wrapper/dists/gradle-9.7.1-bin" ] && \
             [ -d /home/orchords/.gradle/wrapper/dists/gradle-9.7.1-bin ]; then
            cp -a /home/orchords/.gradle/wrapper/dists/gradle-9.7.1-bin \
              "$GRADLE_USER_HOME/wrapper/dists/"
          fi

          printf 'Java: %s\n' "$java_version"
          printf 'Gradle home: %s\n' "$GRADLE_USER_HOME"
          printf 'Logical CPUs: %s\n' "$(nproc)"
          printf 'Memory: %s\n' "$(free -h | awk '/^Mem:/ {print $2}')"

      - name: Fast app, provider and workspace verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Keep the isolated daemon warm on the persistent Lenovo runner.
          # No --max-workers is set: Gradle may use every CPU visible to the job.
          ./gradlew --stacktrace -PciVerify \
            :app:testDebugUnitTest \
            :ai:test \
            :workspace:test
