name: Main Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Give every commit its own concurrency group. Rapid direct-to-main pushes must
# never cancel or replace verification for another SHA; the private runner fleet
# can queue each commit until it receives a terminal result.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Main Verification
    runs-on: ubuntu-24.04-x64
    # Safety guard only, not a resource throttle. Cold Android graphs have more
    # time to finish while normal warm Lenovo runs should complete far sooner.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Install private Android toolchain
        uses: ./.github/actions/setup-private-android-toolchain

      - name: Verify private Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(java -version 2>&1 | head -n1)"
          printf '%s\n' "$java_version"
          printf '%s\n' "$java_version" | grep -Eq 'version "21([.]|\")'
          node --version | grep -Eq '^v22([.]|$)'
          pnpm --version | grep -Eq '^11([.]|$)'
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          printf 'Gradle home: %s\n' "$GRADLE_USER_HOME"
          printf 'Android home: %s\n' "$ANDROID_HOME"
          printf 'Logical CPUs: %s\n' "$(nproc)"
          printf 'Memory: %s\n' "$(free -h | awk '/^Mem:/ {print $2}')"

      - name: Fast app, provider and workspace verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # No --max-workers is set: Gradle may use every CPU visible to the job.
          ./gradlew --stacktrace -PciVerify \
            :app:testDebugUnitTest \
            :ai:test \
            :workspace:test
