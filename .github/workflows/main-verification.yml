name: Main Verification

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single
  cancel-in-progress: true

jobs:
  verify:
    name: Main Verification
    # Live Lenovo private agent. The heavyweight nightly stays on the separate
    # main-verification/b2 lane so ordinary feedback can run independently.
    runs-on: ubuntu-24.04-x64
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          clean: false

      - name: Set up Android and web build toolchain
        uses: ./.github/actions/setup-build
        with:
          # The private runner keeps Gradle state locally. Avoid downloading
          # and restoring the large GitHub Actions Gradle cache.
          gradle: false

      - name: Fast app, provider and workspace verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Keep ordinary main feedback focused on compile + unit-test correctness.
          # Full Android lint and APK/release packaging run in the scheduled Daily Build lane.
          ./gradlew -PciVerify :app:testDebugUnitTest :ai:test :workspace:test
