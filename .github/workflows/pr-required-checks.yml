name: Protected PR Verification

# Required context names are job names, not workflow display names.
# Keep this unfiltered: even a README change must receive a terminal result.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: protected-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app_tests:
    name: App Unit Tests
runs-on: Node_Runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/setup-build
        with:
          gradle: false
      - name: Run app unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

  android_lint:
    name: Android Lint
runs-on: Node_Runner
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/setup-build
        with:
          gradle: false
      - name: Run Android lint with Gradle profile
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --profile :app:lintDebug
      - name: Upload lint Gradle profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-gradle-profile-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 7

  ai_tests:
    name: AI Provider Tests
runs-on: Node_Runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/setup-build
        with:
          gradle: false
          web: false
      - name: Run AI provider tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :ai:test

  verify:
    name: Main Verification
    if: always()
    needs:
      - app_tests
      - android_lint
      - ai_tests
runs-on: Node_Runner
    timeout-minutes: 5
    steps:
      - name: Require every verification shard to succeed
        env:
          APP_TESTS_RESULT: ${{ needs.app_tests.result }}
          ANDROID_LINT_RESULT: ${{ needs.android_lint.result }}
          AI_TESTS_RESULT: ${{ needs.ai_tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for pair in \
            "App Unit Tests:$APP_TESTS_RESULT" \
            "Android Lint:$ANDROID_LINT_RESULT" \
            "AI Provider Tests:$AI_TESTS_RESULT"
          do
            name="${pair%%:*}"
            result="${pair#*:}"
            printf '%s: %s\n' "$name" "$result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo '::error::One or more required verification shards did not succeed.'
            exit 1
          fi

  build:
    name: Daily Build
runs-on: Node_Runner
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/setup-build
        with:
          gradle: false
      - name: Validate unsigned APK and checksums without publishing
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew -PciVerify :app:assembleDebug
          cd app/build/outputs/apk/debug
          sha256sum -- *.apk > SHA256SUMS
          sha256sum --check SHA256SUMS
          echo 'PR build validation only; no signed release or publication occurred.' >> "$GITHUB_STEP_SUMMARY"

  citations:
    name: Citation Integrity Tests
runs-on: Node_Runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/setup-build
        with:
          gradle: false
      - name: Run citation integrity regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'com.orchords.orchordsai.ui.components.message.CitationScopeTest'

  dependencies:
    name: Dependency Submission
runs-on: Node_Runner
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Require same-repository source before privileged execution
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PR_HEAD_REPOSITORY" ] || [ "$PR_HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
            echo '::error::External PR dependency submission requires a trusted no-checkout relay. No privileged build was executed.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - uses: ./.github/actions/setup-build
        with:
          gradle: false
          web: false
      - name: Resolve and submit the actual dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
