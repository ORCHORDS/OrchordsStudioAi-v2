name: Hosted Runner Policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Hosted Runner Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Reject legacy self-hosted runner labels
        shell: bash
        run: |
          set -euo pipefail
          violations="$(grep -RInE '^\s*runs-on:\s*(main-verification|ubuntu-24\.04-x64|self-hosted)\s*$' .github/workflows || true)"
          if [ -n "$violations" ]; then
            printf '%s\n' "$violations"
            echo '::error::Legacy ORCHORDS self-hosted runner labels remain in active workflows.'
            exit 1
          fi
          echo 'All active workflows are free of legacy self-hosted runner labels.'
