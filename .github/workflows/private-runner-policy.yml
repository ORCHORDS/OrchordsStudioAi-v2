name: Private Runner Policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Private Runner Policy
    runs-on: main-verification
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Reject GitHub-hosted runner labels
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^\s*runs-on:\s*(ubuntu-(latest|24\.04|22\.04|20\.04|slim)|windows-(latest|2025|2022|2019)|macos-(latest|[0-9]+))\s*$' .github/workflows; then
            echo '::error::Private repository workflows must use ORCHORDS private/self-hosted runners only.'
            exit 1
          fi
          echo 'All explicit runner labels are private/self-hosted labels.'
