name: Release Latest Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-latest-once.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-latest-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish latest
    runs-on: ubuntu-24.04-x64
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP_VERSION_NAME: '0.1.1'
      APP_VERSION_CODE: '1000001'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Install private Android toolchain
        uses: ./.github/actions/setup-private-android-toolchain

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(java -version 2>&1 | head -n1)"
          printf '%s\n' "$java_version"
          printf '%s\n' "$java_version" | grep -Eq 'version "21([.]|\")'
          node --version | grep -Eq '^v22([.]|$)'
          pnpm --version | grep -Eq '^11([.]|$)'
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"

      - name: Local preflight
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/preflight-local.sh

      - name: Verify web Planning Mode
        shell: bash
        run: |
          set -euo pipefail
          cd web-ui
          pnpm install --frozen-lockfile
          pnpm test:planning
          pnpm typecheck

      - name: Select signed or debug build
        id: build_mode
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo 'signed=true' >> "$GITHUB_OUTPUT"
            echo 'gradle_task=buildAll' >> "$GITHUB_OUTPUT"
            echo 'apk_dir=app/build/outputs/apk/release' >> "$GITHUB_OUTPUT"
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'gradle_task=assembleDebug' >> "$GITHUB_OUTPUT"
            echo 'apk_dir=app/build/outputs/apk/debug' >> "$GITHUB_OUTPUT"
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets unavailable; publishing verified debug APKs.'
          fi

      - name: Prepare signing files
        if: steps.build_mode.outputs.signed == 'true'
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s' "$SIGNING_CONFIG" > local.properties

      - name: Test lint and build APK matrix
        env:
          GRADLE_TASK: ${{ steps.build_mode.outputs.gradle_task }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --stacktrace \
            -PreleaseVersionName="$APP_VERSION_NAME" \
            -PreleaseVersionCode="$APP_VERSION_CODE" \
            :app:testDebugUnitTest \
            :ai:test \
            :workspace:test \
            :app:lintDebug \
            "$GRADLE_TASK"

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f app/app.key local.properties

      - name: Verify APK matrix and embedded version
        env:
          APK_DIR: ${{ steps.build_mode.outputs.apk_dir }}
          VARIANT: ${{ steps.build_mode.outputs.variant }}
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          expected=(
            "$APK_DIR/app-universal-$VARIANT.apk"
            "$APK_DIR/app-arm64-v8a-$VARIANT.apk"
            "$APK_DIR/app-x86_64-$VARIANT.apk"
          )
          rm -rf release-assets
          mkdir -p release-assets
          for apk in "${expected[@]}"; do
            test -s "$apk"
            actual_name="$("$apkanalyzer" manifest version-name "$apk" | tr -d '\r\n')"
            actual_code="$("$apkanalyzer" manifest version-code "$apk" | tr -d '\r\n')"
            test "$actual_name" = "$APP_VERSION_NAME"
            test "$actual_code" = "$APP_VERSION_CODE"
          done
          test "$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" -eq 3
          cp "$APK_DIR/app-universal-$VARIANT.apk" release-assets/orchords-studio-ai-universal.apk
          cp "$APK_DIR/app-arm64-v8a-$VARIANT.apk" release-assets/orchords-studio-ai-arm64-v8a.apk
          cp "$APK_DIR/app-x86_64-$VARIANT.apk" release-assets/orchords-studio-ai-x86_64.apk

          if [ "${{ steps.build_mode.outputs.signed }}" = 'true' ]; then
            aab='app/build/outputs/bundle/release/app-release.aab'
            test -s "$aab"
            test "$("$apkanalyzer" manifest application-id "$aab" | tr -d '\r\n')" = 'com.orchords.orchordsai'
            test "$("$apkanalyzer" manifest version-name "$aab" | tr -d '\r\n')" = "$APP_VERSION_NAME"
            test "$("$apkanalyzer" manifest version-code "$aab" | tr -d '\r\n')" = "$APP_VERSION_CODE"
            cp "$aab" release-assets/orchords-studio-ai.aab
          fi

          cd release-assets
          sha256sum -- *.apk *.aab 2>/dev/null > SHA256SUMS || sha256sum -- *.apk > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload verified build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-release-build
          path: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Generate release notes
        env:
          BUILD_SHA: ${{ github.sha }}
          SIGNED_BUILD: ${{ steps.build_mode.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          build_type='debug APK'
          if [ "$SIGNED_BUILD" = 'true' ]; then build_type='signed release APK/AAB'; fi
          cat > release-notes.md <<EOF
          # ORCHORDS Studio AI — Latest Android Build

          - App version: \`$APP_VERSION_NAME\`
          - Version code: \`$APP_VERSION_CODE\`
          - Commit: \`$BUILD_SHA\`
          - Package type: $build_type

          ## Highlights
          - First-class Planning Mode across Android and web.
          - GitHub and Cloudflare first-class MCP connectors.
          - Secure MCP OAuth/header credential storage and diagnostic redaction.
          - Repaired first-party web-search routing.
          - In-app AI-output reporting path and current privacy/Data Safety source updates.

          ## Verification
          - Web Planning state test and TypeScript typecheck passed.
          - App, AI and workspace unit tests passed.
          - Android lint passed.
          - Universal, arm64-v8a and x86_64 APKs were built and their embedded version metadata verified.
          - SHA-256 checksums were generated and verified before publication.
          EOF

      - name: Remove all older GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY' > /tmp/release_ids.txt
          import json
          for release in json.load(open('/tmp/releases.json', encoding='utf-8')):
              print(release['id'])
          PY
          while read -r release_id; do
            [ -n "$release_id" ] || continue
            curl --fail-with-body --silent --show-error -X DELETE "${headers[@]}" \
              "https://api.github.com/repos/$REPOSITORY/releases/$release_id"
          done < /tmp/release_ids.txt

      - name: Point latest tag at this build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          status="$(curl --silent --show-error -o /tmp/latest-ref.json -w '%{http_code}' "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/tags/latest")"
          if [ "$status" = '200' ]; then
            payload="$(BUILD_SHA="$BUILD_SHA" python3 -c 'import json,os; print(json.dumps({"sha": os.environ["BUILD_SHA"], "force": True}))')"
            curl --fail-with-body --silent --show-error -X PATCH "${headers[@]}" --data "$payload" \
              "https://api.github.com/repos/$REPOSITORY/git/refs/tags/latest" >/dev/null
          elif [ "$status" = '404' ]; then
            payload="$(BUILD_SHA="$BUILD_SHA" python3 -c 'import json,os; print(json.dumps({"ref":"refs/tags/latest","sha":os.environ["BUILD_SHA"]}))')"
            curl --fail-with-body --silent --show-error -X POST "${headers[@]}" --data "$payload" \
              "https://api.github.com/repos/$REPOSITORY/git/refs" >/dev/null
          else
            cat /tmp/latest-ref.json
            exit 1
          fi

      - name: Publish latest GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: ORCHORDS Studio AI v${{ env.APP_VERSION_NAME }} — Latest
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS

      - name: Verify live Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/releases/latest" > /tmp/release.json
          BUILD_SHA="$BUILD_SHA" APP_VERSION_NAME="$APP_VERSION_NAME" python3 - <<'PY'
          import json, os
          release=json.load(open('/tmp/release.json', encoding='utf-8'))
          names={a.get('name') for a in release.get('assets', [])}
          expected={'orchords-studio-ai-universal.apk','orchords-studio-ai-arm64-v8a.apk','orchords-studio-ai-x86_64.apk','SHA256SUMS'}
          assert release.get('tag_name') == 'latest'
          assert release.get('target_commitish') == os.environ['BUILD_SHA']
          assert release.get('draft') is False and release.get('prerelease') is False
          assert expected.issubset(names), (names, expected)
          for asset in release.get('assets', []):
              assert asset.get('state') == 'uploaded'
              assert int(asset.get('size', 0)) > 0
          assert f"v{os.environ['APP_VERSION_NAME']}" in release.get('name','')
          print('Verified live latest release')
          PY
