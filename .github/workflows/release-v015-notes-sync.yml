name: Release v0.1.5 Notes Sync

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

jobs:
  sync-notes:
    name: Merge v0.1.5 fixes into release notes
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Update and verify v0.1.5 notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/releases/tags/v0.1.5" > /tmp/release.json
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/tags/v0.1.5" > /tmp/tag.json

          release_id="$(python3 -c 'import json; print(json.load(open("/tmp/release.json"))["id"])')"
          build_sha="$(python3 -c 'import json; print(json.load(open("/tmp/tag.json"))["object"]["sha"])')"
          package_type="$(python3 - <<'PY'
          import json
          release=json.load(open('/tmp/release.json', encoding='utf-8'))
          names={a['name'] for a in release.get('assets', [])}
          print('signed release APK/AAB' if 'orchords-studio-ai.aab' in names else 'verified installable debug APK')
          PY
          )"

          cat > /tmp/body.md <<EOF
          # ORCHORDS Studio AI 0.1.5

          - Version: \`0.1.5\`
          - Version code: \`1000005\`
          - Commit: \`$build_sha\`
          - Package type: $package_type

          ## Highlights
          - Fixed missing ProviderUsageEventDAO dependency registration needed to construct GenerationHandler and ChatVM.
          - First-class Planning Mode on Android and web.
          - First-class GitHub and Cloudflare MCP connectors.
          - Secure MCP credential handling and diagnostic redaction.
          - Repaired first-party web-search routing.
          - In-app AI-output reporting.

          ## Fixed in v0.1.5
          - Connection testing now uses the persisted first-party gateway credential; unsaved key edits cannot produce a misleading green connection result.
          - Gateway HTTP 401/403 authentication failures stop immediately instead of being retried or presented as generic network loss.
          - Transient gateway 429/5xx failures retain the intended retry policy before provider output, while post-output requests are not replayed automatically.
          - Existing encrypted Orchords gateway credentials stored under recognized legacy provider UUIDs are re-keyed to the canonical provider UUID without writing plaintext to ordinary settings.
          - The persisted first-party bearer credential is authoritative when stale assistant/model custom Authorization headers are also present, preventing duplicate or shadowing Authorization values.
          - Provider-save success is reported only after secure settings persistence succeeds, with focused regression coverage for persisted-vs-candidate testing, retry classification, Authorization precedence, and credential re-key failure paths.

          ## Verification
          - Local release preflight completed in the publishing workflow.
          - Web Planning regression test, TypeScript typecheck and production web build.
          - App, AI and workspace unit tests.
          - Android lint.
          - Universal, arm64-v8a and x86_64 APK manifests verified for this version.
          - SHA-256 checksums verified before publication.
          EOF

          python3 - <<'PY' > /tmp/patch.json
          import json
          body=open('/tmp/body.md', encoding='utf-8').read()
          print(json.dumps({'body': body}))
          PY

          curl --fail-with-body --silent --show-error -X PATCH "${headers[@]}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/patch.json \
            "https://api.github.com/repos/$REPOSITORY/releases/$release_id" > /tmp/updated.json

          python3 - <<'PY'
          import json
          release=json.load(open('/tmp/updated.json', encoding='utf-8'))
          body=release.get('body', '')
          assert release.get('tag_name') == 'v0.1.5'
          assert '## Highlights' in body
          assert '## Fixed in v0.1.5' in body
          assert '401/403 authentication failures' in body
          assert 'legacy provider UUIDs' in body
          assert 'Authorization precedence' in body
          assert '## Verification' in body
          print('Verified v0.1.5 release notes contain previous highlights plus the auth fixes')
          PY
