name: Release

on:
  push:
    branches: [main]
    paths:
      - 'gradle.properties'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  # If the stale legacy Daily Build ever leaves its queue, rebuild current main
  # and make the current version authoritative again.
  workflow_run:
    workflows: ['Daily Build']
    types: [completed]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-24.04-x64
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Install pinned Android toolchain
        uses: ./.github/actions/setup-private-android-toolchain

      - name: Resolve canonical app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(awk -F= '$1 == "releaseVersionName" {print $2}' gradle.properties | tail -n1 | tr -d '\r[:space:]')"
          version_code="$(awk -F= '$1 == "releaseVersionCode" {print $2}' gradle.properties | tail -n1 | tr -d '\r[:space:]')"

          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid releaseVersionName in gradle.properties: $version_name"
            exit 1
          }
          [[ "$version_code" =~ ^[0-9]+$ ]] || {
            echo "::error::Invalid releaseVersionCode in gradle.properties: $version_code"
            exit 1
          }
          [ "$version_code" -ge 1 ] && [ "$version_code" -le 2100000000 ] || {
            echo "::error::releaseVersionCode must be in 1..2100000000"
            exit 1
          }

          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
          echo "Release version: $version_name ($version_code)"

      - name: Require signing material
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ] || {
            echo "::error::A GitHub Release must be a signed release build. Configure KEY_BASE64 and SIGNING_CONFIG."
            exit 1
          }

      - name: Materialize signing files
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEY_BASE64" | base64 --decode > app/app.key
          printf '%s' "$SIGNING_CONFIG" > local.properties
          chmod 600 app/app.key local.properties

      - name: Local preflight
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/preflight-local.sh

      - name: Verify web app
        shell: bash
        run: |
          set -euo pipefail
          cd web-ui
          pnpm install --frozen-lockfile
          pnpm test:planning
          pnpm typecheck
          pnpm build

      - name: Test, lint and build signed Android artifacts
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --stacktrace \
            -PreleaseVersionName="$APP_VERSION_NAME" \
            -PreleaseVersionCode="$APP_VERSION_CODE" \
            :app:testDebugUnitTest \
            :ai:test \
            :workspace:test \
            :app:lintDebug \
            :app:buildAll

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f app/app.key local.properties

      - name: Verify exact APK/AAB matrix and embedded version
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer"

          apk_dir='app/build/outputs/apk/release'
          expected=(
            "$apk_dir/app-universal-release.apk"
            "$apk_dir/app-arm64-v8a-release.apk"
            "$apk_dir/app-x86_64-release.apk"
          )

          for apk in "${expected[@]}"; do
            test -s "$apk" || { echo "::error::Missing release APK: $apk"; exit 1; }
            actual_name="$("$apkanalyzer" manifest version-name "$apk" | tr -d '\r\n')"
            actual_code="$("$apkanalyzer" manifest version-code "$apk" | tr -d '\r\n')"
            [ "$actual_name" = "$APP_VERSION_NAME" ] || {
              echo "::error::APK versionName mismatch: $apk expected=$APP_VERSION_NAME actual=$actual_name"
              exit 1
            }
            [ "$actual_code" = "$APP_VERSION_CODE" ] || {
              echo "::error::APK versionCode mismatch: $apk expected=$APP_VERSION_CODE actual=$actual_code"
              exit 1
            }
          done

          actual_count="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')"
          [ "$actual_count" -eq 3 ] || {
            echo "::error::Expected exactly 3 APK outputs, found $actual_count"
            find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print
            exit 1
          }

          aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$aab" || { echo '::error::Signed release AAB missing'; exit 1; }
          [ "$("$apkanalyzer" manifest application-id "$aab" | tr -d '\r\n')" = 'com.orchords.orchordsai' ]
          [ "$("$apkanalyzer" manifest version-name "$aab" | tr -d '\r\n')" = "$APP_VERSION_NAME" ]
          [ "$("$apkanalyzer" manifest version-code "$aab" | tr -d '\r\n')" = "$APP_VERSION_CODE" ]

          rm -rf release-assets
          mkdir -p release-assets
          cp "${expected[0]}" release-assets/orchords-studio-ai-universal.apk
          cp "${expected[1]}" release-assets/orchords-studio-ai-arm64-v8a.apk
          cp "${expected[2]}" release-assets/orchords-studio-ai-x86_64.apk
          cp "$aab" release-assets/orchords-studio-ai.aab
          mapping='app/build/outputs/mapping/release/mapping.txt'
          if [ -s "$mapping" ]; then cp "$mapping" release-assets/mapping.txt; fi

          cd release-assets
          sha256sum -- *.apk *.aab > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Refuse to reuse a version tag for different source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          status="$(curl --silent --show-error -o /tmp/release-tag.json -w '%{http_code}' "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          if [ "$status" = '404' ]; then exit 0; fi
          [ "$status" = '200' ] || { cat /tmp/release-tag.json; exit 1; }
          existing_sha="$(python3 -c 'import json; print(json.load(open("/tmp/release-tag.json"))["object"]["sha"])')"
          [ "$existing_sha" = "$BUILD_SHA" ] || {
            echo "::error::Tag $RELEASE_TAG already points to $existing_sha. Bump releaseVersionName/releaseVersionCode before publishing new source."
            exit 1
          }

      - name: Upload verified build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-apks
          path: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/mapping.txt
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Generate release notes
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # ORCHORDS Studio AI $APP_VERSION_NAME

          - Version: \`$APP_VERSION_NAME\`
          - Version code: \`$APP_VERSION_CODE\`
          - Commit: \`$BUILD_SHA\`
          - Package: \`com.orchords.orchordsai\`

          ## Highlights
          - First-class Planning Mode on Android and web.
          - First-class GitHub and Cloudflare MCP connectors.
          - Secure MCP OAuth/header credential storage and diagnostic redaction.
          - Repaired first-party web-search routing.
          - In-app AI-output reporting path and updated privacy/Data Safety source documentation.

          ## Verified before publication
          - Web Planning regression test, TypeScript typecheck and production web build.
          - App, AI and workspace unit tests.
          - Android lint.
          - Signed universal, arm64-v8a and x86_64 APK matrix.
          - Signed Android App Bundle.
          - Embedded package/version metadata for every published binary.
          - SHA-256 checksum verification.
          EOF

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ORCHORDS Studio AI v${{ steps.version.outputs.name }}
          prerelease: false
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: |
            release-assets/orchords-studio-ai-universal.apk
            release-assets/orchords-studio-ai-arm64-v8a.apk
            release-assets/orchords-studio-ai-x86_64.apk
            release-assets/orchords-studio-ai.aab
            release-assets/SHA256SUMS
            release-assets/mapping.txt

      - name: Verify new Release before cleanup
        id: verify_release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/releases/tags/$RELEASE_TAG" > /tmp/new-release.json
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" > /tmp/new-tag.json
          BUILD_SHA="$BUILD_SHA" python3 - <<'PY'
          import json, os
          release=json.load(open('/tmp/new-release.json', encoding='utf-8'))
          tag=json.load(open('/tmp/new-tag.json', encoding='utf-8'))
          expected={
              'orchords-studio-ai-universal.apk',
              'orchords-studio-ai-arm64-v8a.apk',
              'orchords-studio-ai-x86_64.apk',
              'orchords-studio-ai.aab',
              'SHA256SUMS',
              'mapping.txt',
          }
          names={asset.get('name') for asset in release.get('assets', [])}
          assert release.get('draft') is False
          assert release.get('prerelease') is False
          assert expected.issubset(names), (names, expected)
          for asset in release.get('assets', []):
              assert asset.get('state') == 'uploaded', asset
              assert int(asset.get('size', 0)) > 0, asset
          assert tag.get('object', {}).get('sha') == os.environ['BUILD_SHA'], tag
          print(release['id'])
          PY
          release_id="$(python3 -c 'import json; print(json.load(open("/tmp/new-release.json"))["id"])')"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Remove every older GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          KEEP_RELEASE_ID: ${{ steps.verify_release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/releases?per_page=100" > /tmp/releases.json
          KEEP_RELEASE_ID="$KEEP_RELEASE_ID" python3 - <<'PY' > /tmp/delete-release-ids.txt
          import json, os
          keep=int(os.environ['KEEP_RELEASE_ID'])
          for release in json.load(open('/tmp/releases.json', encoding='utf-8')):
              if int(release['id']) != keep:
                  print(release['id'])
          PY
          while read -r release_id; do
            [ -n "$release_id" ] || continue
            curl --fail-with-body --silent --show-error -X DELETE "${headers[@]}" \
              "https://api.github.com/repos/$REPOSITORY/releases/$release_id" >/dev/null
          done < /tmp/delete-release-ids.txt

      - name: Verify Releases contains only current release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          KEEP_RELEASE_ID: ${{ steps.verify_release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl --fail-with-body --silent --show-error "${headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/releases?per_page=100" > /tmp/final-releases.json
          KEEP_RELEASE_ID="$KEEP_RELEASE_ID" RELEASE_TAG="$RELEASE_TAG" python3 - <<'PY'
          import json, os
          releases=json.load(open('/tmp/final-releases.json', encoding='utf-8'))
          assert len(releases) == 1, releases
          release=releases[0]
          assert int(release['id']) == int(os.environ['KEEP_RELEASE_ID'])
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          print('Verified exactly one current GitHub Release')
          PY
