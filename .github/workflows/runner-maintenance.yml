name: Hosted Runner Canary

on:
  schedule:
    - cron: '43 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Report hosted runner environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# GitHub-hosted runner canary"
            echo
            echo "- runner: $RUNNER_NAME"
            echo "- os: $RUNNER_OS"
            echo "- arch: $RUNNER_ARCH"
            echo "- CPUs: $(nproc)"
            echo "- memory: $(free -h | awk '/^Mem:/ {print $2}')"
            echo "- disk free: $(df -h / | awk 'NR==2{print $4}')"
            echo "- KVM: $([ -e /dev/kvm ] && echo available || echo unavailable)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
