name: Security Analysis

# Private-repository security analysis on ORCHORDS self-hosted runners.
# Fast source/secrets checks run on relevant main pushes. Heavier dependency
# and workflow/configuration sweeps run weekly or on owner dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ai/**'
      - 'common/**'
      - 'document/**'
      - 'oauth/**'
      - 'search/**'
      - 'scripts/**'
      - 'speech/**'
      - 'tools/**'
      - 'trace-cli/**'
      - 'videogen/**'
      - 'web-ui/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Give every commit its own security-analysis group. Rapid direct-to-main
# pushes must never cancel or replace analysis for another SHA.
concurrency:
  group: security-analysis-${{ github.sha }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1
  TRIVY_VERSION: 0.74.0
  OSV_VERSION: 2.5.1
  SEMGREP_VERSION: 1.174.0
  UV_VERSION: 0.12.10

jobs:
  secrets:
    name: Gitleaks
    runs-on: ubuntu-24.04-x64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: false
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /tmp
          install -m 0755 /tmp/gitleaks "$RUNNER_TEMP/gitleaks"
      - name: Scan committed history
        shell: bash
        run: |
          set -euo pipefail
          mode='--log-opts=HEAD'
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            mode='--log-opts=--all'
          fi
          "$RUNNER_TEMP/gitleaks" git . --redact $mode

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-24.04-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Enforce intentional Android activity exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          manifest = 'app/src/main/AndroidManifest.xml'
          android = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse(manifest).getroot()
          expected = {'com.orchords.orchordsai.OrchordsAiActivity'}
          exported = set()
          launcher_ok = False

          for activity in root.findall('./application/activity'):
              name = activity.get(android + 'name')
              if activity.get(android + 'exported') == 'true':
                  exported.add(name)
              if name == 'com.orchords.orchordsai.OrchordsAiActivity':
                  for intent_filter in activity.findall('intent-filter'):
                      actions = {a.get(android + 'name') for a in intent_filter.findall('action')}
                      categories = {c.get(android + 'name') for c in intent_filter.findall('category')}
                      if ('android.intent.action.MAIN' in actions and
                              'android.intent.category.LAUNCHER' in categories):
                          launcher_ok = True

          if exported != expected:
              raise SystemExit(f'Unexpected exported Android activities: {sorted(exported)}; expected {sorted(expected)}')
          if not launcher_ok:
              raise SystemExit('OrchordsAiActivity must remain the MAIN/LAUNCHER activity')
          print('Android exported-activity policy verified:', ', '.join(sorted(exported)))
          PY
      - name: Install pinned uv and Semgrep in private tool cache
        shell: bash
        run: |
          set -euo pipefail
          cache_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/studioai-security"
          uv_root="$cache_root/uv/${UV_VERSION}"
          uv_bin="$uv_root/uv"
          tool_root="$cache_root/Semgrep/${SEMGREP_VERSION}"
          tool_bin="$tool_root/bin"
          mkdir -p "$cache_root/uv" "$cache_root/Semgrep" "$tool_bin"
          exec 9>"$cache_root/Semgrep/.install.lock"
          flock 9

          if [ ! -x "$uv_bin" ]; then
            staging="${uv_root}.staging-$$"
            rm -rf "$staging"
            mkdir -p "$staging"
            curl --proto '=https' --tlsv1.2 -LsSf \
              "https://releases.astral.sh/github/uv/releases/download/${UV_VERSION}/uv-installer.sh" \
              | env UV_UNMANAGED_INSTALL="$staging" sh
            "$staging/uv" --version | grep -F "uv ${UV_VERSION}"
            rm -rf "$uv_root"
            mv "$staging" "$uv_root"
          fi

          export UV_TOOL_DIR="$tool_root/tools"
          export UV_TOOL_BIN_DIR="$tool_bin"
          export UV_CACHE_DIR="$cache_root/uv/cache"
          if [ ! -x "$tool_bin/semgrep" ] || ! "$tool_bin/semgrep" --version | grep -Fx "$SEMGREP_VERSION" >/dev/null; then
            rm -rf "$UV_TOOL_DIR" "$tool_bin"
            mkdir -p "$tool_bin"
            "$uv_bin" tool install --python "$(command -v python3)" --force "semgrep==${SEMGREP_VERSION}"
          fi
          "$tool_bin/semgrep" --version | grep -Fx "$SEMGREP_VERSION"
          echo "SEMGREP_BIN=$tool_bin/semgrep" >> "$GITHUB_ENV"
      - name: Run pinned Semgrep
        shell: bash
        run: |
          set -euo pipefail
          "$SEMGREP_BIN" scan \
            --config p/auto \
            --config p/owasp-top-ten \
            --error \
            --metrics=off \
            --exclude-rule java.android.security.exported_activity.exported_activity \
            --exclude 'material3/third-party/**' \
            --exclude '**/build/**' \
            --exclude 'web-ui/node_modules/**' \
            .

  dependencies:
    name: Trivy Vulnerabilities
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz -C /tmp
          install -m 0755 /tmp/trivy "$RUNNER_TEMP/trivy"
      - name: Block HIGH/CRITICAL dependency vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy" fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed .

  osv:
    name: OSV Dependency Cross-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Install OSV Scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          install -m 0755 /tmp/osv-scanner "$RUNNER_TEMP/osv-scanner"
      - name: Scan dependency manifests and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/osv-scanner" scan source -r .

  configuration:
    name: Trivy Misconfiguration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-x64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz -C /tmp
          install -m 0755 /tmp/trivy "$RUNNER_TEMP/trivy"
      - name: Scan repository configuration and secrets
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy" fs --scanners misconfig,secret --severity HIGH,CRITICAL --exit-code 1 .

  aab-artifact:
    name: Signed AAB Manifest Inspection
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: main-verification
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AAB_OUTPUT: app/build/outputs/bundle/release/app-release.aab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Set up private Android toolchain
        uses: ./.github/actions/setup-private-android-toolchain
      - name: Restore Gradle build cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          tar --warning=no-file-changed -xzf "$RUNNER_TEMP/gradle-cache.tar.gz" -C ~/.gradle || true
      - name: Prepare signing files when secrets are present
        id: signing
        env:
          KEY_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            key_dir="$RUNNER_TEMP/signing"
            mkdir -p "$key_dir"
            echo "$KEY_BASE64" | base64 -d > "$key_dir/release.jks"
            echo "signing.properties" > "$key_dir/.placeholder"
            echo "Signed release build will be produced"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets present; producing unsigned bundle (manifest inspection still valid)"
          fi
      - name: Build signed or unsigned release bundle
        env:
          ORCHORDS_KEYSTORE_FILE: ${{ runner.temp }}/signing/release.jks
          ORCHORDS_SIGNING_PROPERTIES: ${{ runner.temp }}/signing/signing.properties
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:bundleRelease --no-daemon --console=plain
          test -s "$AAB_OUTPUT" || { echo "::error::Expected AAB missing: $AAB_OUTPUT"; exit 1; }
      - name: Remove signing files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/signing"
      - name: Extract AAB and inspect manifest with apkanalyzer
        env:
          AAB_INSPECT_DIR: ${{ runner.temp }}/aab-inspect
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer" || { echo "::error::apkanalyzer not found"; exit 1; }
          rm -rf "$AAB_INSPECT_DIR"
          mkdir -p "$AAB_INSPECT_DIR"
          cd "$AAB_INSPECT_DIR"
          unzip -q "$GITHUB_WORKSPACE/$AAB_OUTPUT"
          cd "$GITHUB_WORKSPACE"
          {
            echo "=== AAB manifest inspection ==="
            echo "package:        $("$apkanalyzer" manifest application-id "$AAB_OUTPUT" | tr -d '\r\n')"
            echo "versionName:    $("$apkanalyzer" manifest version-name   "$AAB_OUTPUT" | tr -d '\r\n')"
            echo "versionCode:    $("$apkanalyzer" manifest version-code   "$AAB_OUTPUT" | tr -d '\r\n')"
            echo "minSdk:         $("$apkanalyzer" manifest min-sdk        "$AAB_OUTPUT" | tr -d '\r\n')"
            echo "targetSdk:      $("$apkanalyzer" manifest target-sdk     "$AAB_OUTPUT" | tr -d '\r\n')"
            echo "permissions:"
            "$apkanalyzer" manifest permissions "$AAB_OUTPUT" | sed 's/^/  /'
            echo "files (top 25):"
            "$apkanalyzer" files list "$AAB_OUTPUT" | sort | head -n 25 | sed 's/^/  /'
          } | tee aab-manifest.txt
          grep -q "com.orchords.orchordsai" aab-manifest.txt
          version_name="$("$apkanalyzer" manifest version-name "$AAB_OUTPUT" | tr -d '\r\n')"
          version_code="$("$apkanalyzer" manifest version-code "$AAB_OUTPUT" | tr -d '\r\n')"
          test -n "$version_name" || { echo "::error::apkanalyzer returned empty versionName"; exit 1; }
          test -n "$version_code" || { echo "::error::apkanalyzer returned empty versionCode"; exit 1; }
          echo "App version from apkanalyzer: name=$version_name code=$version_code"
      - name: Generate SHA-256 of signed AAB
        shell: bash
        run: |
          set -euo pipefail
          (cd "$(dirname "$AAB_OUTPUT")" && sha256sum "$(basename "$AAB_OUTPUT")") | tee aab-checksum.txt
      - name: Install Trivy for AAB scan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz -C /tmp
          install -m 0755 /tmp/trivy "$RUNNER_TEMP/trivy"
      - name: Scan extracted AAB with Trivy
        env:
          AAB_INSPECT_DIR: ${{ runner.temp }}/aab-inspect
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy" fs --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL --exit-code 0 \
            "$AAB_INSPECT_DIR"
      - name: Upload AAB inspection evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aab-evidence
          for f in aab-manifest.txt aab-checksum.txt; do
            if [ -s "$f" ]; then cp "$f" aab-evidence/; fi
          done
          ls -la aab-evidence || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: aab-inspection-evidence
          path: aab-evidence
          if-no-files-found: warn
          retention-days: 14
