# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Canonical app release identity. app/build.gradle.kts validates these values and
# embeds them into normal APK/AAB builds unless an explicit command-line override
# is supplied. Keep versionCode strictly increasing for Android/Google Play.
# Release trigger: v0.1.5 final auth hotfix + newest-only Release cleanup
releaseVersionName=0.1.5
releaseVersionCode=1000005

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Private CI runs on a large persistent Lenovo host. Avoid a fixed heap ceiling:
# let the JVM scale with the memory actually available to the runner while
# retaining OS/headroom for Android tooling and concurrent runner services.
org.gradle.jvmargs=-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8
# JDK selection is environment-specific. Use JAVA_HOME or Gradle toolchains;
# never commit a developer-machine-specific Java home path.
kotlin.compiler.execution.strategy=in-process
# Defense in depth for CVE-2026-53914: do not read incremental KAPT caches.
# ORCHORDS AI currently uses KSP; keep this safeguard if KAPT is introduced.
kapt.incremental.apt=false
# Parallel execution across decoupled subprojects (app, common, material3, ai, ...).
# Gradle's default worker count follows the processors visible to the runner;
# intentionally do not set org.gradle.workers.max so the Lenovo can use all cores.
org.gradle.parallel=true
# Reuse task outputs across CI runs and local builds; required for
# gradle/actions/setup-gradle to persist build-cache entries.
org.gradle.caching=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/packages
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from its dependencies.
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true